# =================================================================
#  XII-Days - Configuration (toutes les valeurs sont en français)
#  Chaque bloc est lu par ConfigManager. Les commentaires expliquent
#  l'effet de chaque paramètre sur le gameplay.
# =================================================================

# Version du schéma : si le fichier installé est plus ancien, il est
# automatiquement remplacé (l'ancien est sauvegardé en .bak).
config-version: 7

# -----------------------------------------------------------------
# Items d'UPGRADE et TOTEM (consommés par clic droit)
# -----------------------------------------------------------------
upgrades:
  saignement-chance: 0.30             # chance d'appliquer le saignement
  saignement-duree-ticks: 80          # durée du saignement (4 s)
  saignement-cooldown-secondes: 8     # anti-spam par victime
  garde-cooldown-secondes: 10         # délai entre deux proc Garde
  prospecteur-chance-par-niveau: 0.10 # +1 drop de minerai par niveau

# -----------------------------------------------------------------
# Zone de jeu
# -----------------------------------------------------------------
zone:
  # Taille de la zone carrée : 2000 x 2000 blocs (spécification §3).
  size: 2000
  # Hauteur d'apparition de la zone d'attente au-dessus du centre.
  waiting-lobby-height: 40
  # AUTO-CENTRAGE : le plugin décale automatiquement l'ancre pour que le
  # CENTRE du bâtiment (calculé depuis les blocs du .nbt) tombe sur le
  # centre de la zone, et pose les joueurs sur le plancher. Mettre false
  # pour revenir au placement brut par l'origine + offsets ci-dessous.
  waiting-lobby-auto-center: true
  # Décalage de L'ANCRE du lobby (coin origine du .nbt) par rapport au
  # centre de la zone. Exemple pour centrer un lobby de 30x38 :
  # anchor-x: -15, anchor-z: -19.
  waiting-lobby-anchor-x: 0
  waiting-lobby-anchor-y: 0
  waiting-lobby-anchor-z: 0
  # Point d'apparition des joueurs, relatif à l'ORIGINE du .nbt
  # (= position du bloc structure au moment de la sauvegarde).
  # Ces offsets s'AJOUTENT au calage automatique (centrage + plancher) :
  # spawn-y: 7 => 7 blocs AU-DESSUS du plancher détecté.
  waiting-lobby-spawn-x: 0
  waiting-lobby-spawn-y: 7
  waiting-lobby-spawn-z: 0

# -----------------------------------------------------------------
# Bases des équipes
# -----------------------------------------------------------------
bases:
  # Distance (blocs) entre le centre de la zone et chaque base.
  # Les bases sont posées sur les 4 axes cardinaux pour rester loin
  # des donjons qui occupent les 4 diagonales (+/-500 ; +/-500).
  radius: 300
  # Position du coeur par rapport au point d'ancrage de la base.
  # À ajuster selon la structure .nbt fournie par le développeur.
  core-offset-y: 3
  spawn-offset: 4

# -----------------------------------------------------------------
# Durées (en secondes) - spécifications §13, §14, §17, §20, §19
# -----------------------------------------------------------------
durations:
  countdown: 5            # compte à rebours avant la sélection de classe
  class-selection: 30     # durée de la sélection de classe
  sub-phase: 300          # 5 minutes par sous-phase => combat après 30 min
  ending: 30              # temps d'affichage des résultats avant retour WAITING

# -----------------------------------------------------------------
# Respawn - spécification §19 et §29
# -----------------------------------------------------------------
respawn:
  step-seconds: 5         # +5 secondes par mort subie
  max-seconds: 30         # plafond du délai de respawn

# -----------------------------------------------------------------
# Combat
# -----------------------------------------------------------------
combat:
  # Fenêtre de combat : une déconnexion dans cette fenêtre après un
  # coup reçu est considérée comme une mort (spec §30).
  window-seconds: 15

# -----------------------------------------------------------------
# Points - spécification §32
# -----------------------------------------------------------------
points:
  kill: 15                # kill classique
  first-kill: 30          # premier kill de la partie
  exploration-per-chunk: 1   # découverte d'un nouveau chunk
  package-open: 10        # ouverture d'un colis (package)
  rare-item: 20           # objet rare trouvé dans un colis
  core-destroyed: 50      # destruction du coeur d'une équipe
  death-penalty: 10       # points retirés lors d'une mort
  rare-item-chance: 0.15  # probabilité qu'un colis contienne un objet rare

  mining:
    # Points attribués par minerai cassé (MiningService).
    # Noms français affichés dans la barre d'action.
    amethyst: 2
    coal: 2
    copper: 2
    iron: 10
    gold: 50
    redstone: 3
    lapis: 8
    diamond: 150
    emerald: 300
    ancient-debris: 60

# -----------------------------------------------------------------
# Colis (packages) - spécification §17
# -----------------------------------------------------------------
packages:
  min-interval-seconds: 60   # intervalle minimal entre deux colis
  max-interval-seconds: 180  # intervalle maximal
  upgrade-factor: 2.0        # facteur appliqué pendant PACKAGE_UPGRADE

# -----------------------------------------------------------------
# Météorites - spécifications §22, §25
# -----------------------------------------------------------------
meteorites:
  min-interval-seconds: 45   # intervalle minimal entre deux chutes
  max-interval-seconds: 120  # intervalle maximal
  upgrade-factor: 2.0        # fréquence multipliée en MORE_METEORITES
  power: 6.0                 # puissance de l'explosion (blocs détruits)
  radius: 8                  # rayon de dégâts sur les joueurs
  damage-min-percent: 0.35   # 35% de la vie max minimum
  damage-max-percent: 0.50   # 50% de la vie max maximum

# -----------------------------------------------------------------
# Mort subite - spécification §26
# -----------------------------------------------------------------
sudden-death:
  dragon-interval-seconds: 60   # un dragon spawn toutes les X secondes

# -----------------------------------------------------------------
# Resource Pack (envoi automatique aux joueurs)
# -----------------------------------------------------------------
resource-pack:
  url: "https://raw.githubusercontent.com/Fire-Sparks-Studio/xii_plugin/refs/heads/master/resource-pack.zip"
  sha1: "e6990363f4d34dc7b36f5325794c06da2d1b12fa"
  prompt: ""                     # message affiché au joueur (vide = pas de prompt)

# -----------------------------------------------------------------
# Équipes
# -----------------------------------------------------------------
teams:
  max-players: 4            # taille par défaut d'une équipe créée

