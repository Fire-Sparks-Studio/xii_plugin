plugins {
    id 'java'
}

group = 'com.mceteams.xii'

// ------------------------------------------------------------------
// Versionnement automatique :
// le numéro de build est stocké dans version.properties et incrémenté
// à chaque construction (jar) => version "2.0.0-bA<n>".
// ------------------------------------------------------------------
def versionFile = file('version.properties')
def buildNumber = 0

if (versionFile.exists()) {
    def props = new Properties()
    props.load(versionFile.newReader())
    buildNumber = props.getProperty('buildNumber', '0').toInteger()
}

version = "2.0.1-bB${buildNumber}-fr"

tasks.register('incrementBuildNumber') {
    doLast {
        buildNumber++
        versionFile.text = "buildNumber=${buildNumber}"
        println "Build number incremented to A${buildNumber}"
    }
}

repositories {
    mavenCentral()

    maven {
        name = 'papermc'
        url = 'https://repo.papermc.io/repository/maven-public/'
    }
}

dependencies {
    // API Paper fournie par le serveur : jamais embarquée dans le jar.
    compileOnly 'io.papermc.paper:paper-api:26.2.build.+'

    // JUnit uniquement pour les tests unitaires (voir src/test).
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    // Launcher requis par Gradle 9 pour exécuter la plateforme JUnit.
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // Adventure n'est pas fourni au runtime des tests (il l'est en jeu) :
    // TeamManager l'utilise pour les préfixes d'équipes Bukkit.
    // Le sérialiseur legacy tire adventure-api/key/examination en transitif.
    testRuntimeOnly 'net.kyori:adventure-text-serializer-legacy:5.2.0'
    // Les classes Bukkit doivent exister au runtime des tests (jamais
    // appelées : le code est gardé par des null-checks / try-catch),
    // mais leur ABSENCE ferait échouer le chargement des classes.
    testRuntimeOnly 'io.papermc.paper:paper-api:26.2.build.+'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

processResources {
    filesMatching('plugin.yml') {
        expand(
                version: project.version
        )
    }
}

test {
    useJUnitPlatform()
}

jar {
    finalizedBy incrementBuildNumber
}
