plugins {
    id 'java'
}

group = 'com.mceteams.xii'

// ------------------------------------------------------------------
// Versionnement automatique :
// le numéro de build est stocké dans version.properties et incrémenté
// à chaque construction (jar) => version "2.0.0-bA<n>".
// ------------------------------------------------------------------
def versionFile = file('version.properties')
def buildNumber = 0

if (versionFile.exists()) {
    def props = new Properties()
    props.load(versionFile.newReader())
    buildNumber = props.getProperty('buildNumber', '0').toInteger()
}

version = "2.0.0-bA${buildNumber}"

tasks.register('incrementBuildNumber') {
    doLast {
        buildNumber++
        versionFile.text = "buildNumber=${buildNumber}"
        println "Build number incremented to A${buildNumber}"
    }
}

repositories {
    mavenCentral()

    maven {
        name = 'papermc'
        url = 'https://repo.papermc.io/repository/maven-public/'
    }
}

dependencies {
    // API Paper fournie par le serveur : jamais embarquée dans le jar.
    compileOnly 'io.papermc.paper:paper-api:26.2.build.+'

    // JUnit uniquement pour les tests unitaires (voir src/test).
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

processResources {
    filesMatching('plugin.yml') {
        expand(
                version: project.version
        )
    }
}

test {
    useJUnitPlatform()
}

jar {
    finalizedBy incrementBuildNumber
}
