plugins {
    id 'java'
    id 'io.papermc.paperweight.userdev' version '2.0.0-beta.22'
}

// Paper 26.1+ : serveur NON-obfusqué (Mojang mappings). La tâche jar
// produit directement le jar de production : PAS de réobfuscation (le
// dev bundle 26.2 ne fournit d'ailleurs plus de mappings de réobf).
group = 'com.mceteams.xii'

// ------------------------------------------------------------------
// Versionnement automatique :
// le numéro de build est stocké dans version.properties et incrémenté
// à chaque construction (jar) => version "2.0.0-bA<n>".
// ------------------------------------------------------------------
def versionFile = file('version.properties')
def buildNumber = 0

if (versionFile.exists()) {
    def props = new Properties()
    props.load(versionFile.newReader())
    buildNumber = props.getProperty('buildNumber', '0').toInteger()
}

version = "2.0.1-b${buildNumber}-fr"

tasks.register('incrementBuildNumber') {
    doLast {
        buildNumber++
        versionFile.text = "buildNumber=${buildNumber}"
        println "Build number incremented to A${buildNumber}"
    }
}

repositories {
    mavenCentral()

    maven {
        name = 'papermc'
        url = 'https://repo.papermc.io/repository/maven-public/'
    }
}

dependencies {
    // Dev bundle Paper (26.2, Mojang-mapped) : fournit l'API Paper +
    // les classes NMS net.minecraft.* au statique. CompileOnly, jamais
    // embarqué dans le jar. Aucune dépendance runtime sur le serveur.
    paperweight.paperDevBundle("26.2.build.+")

    // JUnit uniquement pour les tests unitaires (voir src/test).
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    // Launcher requis par Gradle 9 pour exécuter la plateforme JUnit.
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // Adventure n'est pas fourni au runtime des tests (il l'est en jeu) :
    // TeamManager l'utilise pour les préfixes d'équipes Bukkit.
    // Le sérialiseur legacy tire adventure-api/key/examination en transitif.
    testRuntimeOnly 'net.kyori:adventure-text-serializer-legacy:5.2.0'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

processResources {
    // La version est injectée dans plugin.yml ; on la déclare comme input
    // pour que le task re-s'exécute à chaque changement de version (sinon
    // Gradle gardait un plugin.yml obsolète "up-to-date").
    inputs.property("version", version)
    filesMatching('plugin.yml') {
        expand(
                version: project.version
        )
    }
}

test {
    useJUnitPlatform()
}

jar {
    finalizedBy incrementBuildNumber
}

// ------------------------------------------------------------------
// Archiver automatiquement chaque build :
// copie le jar de production unique (output de la tâche jar) vers
// l'archive partagée. On copie DIRECTEMENT le fichier produit par
// prepareDeployJar (dossier dédié build/deploy, distinct de libs pour
// ne pas écraser l'archive de la tâche jar).
// ------------------------------------------------------------------
def archiveDir = 'T:/dev/minecraft/1.21.11/xiidays/archive/jars/Plugin'

tasks.register('prepareDeployJar', Copy) {
    from tasks.jar
    into layout.buildDirectory.dir('deploy')
    rename { it.replaceAll(/-dev-|-dev\\.|-all-|-all\\./, '-') }
}

tasks.register('archiveDeployJar', Copy) {
    dependsOn tasks.prepareDeployJar
    from tasks.jar
    into archiveDir
    rename { it.replaceAll(/-dev-|-dev\\.|-all-|-all\\./, '-') }
    shouldRunAfter tasks.jar
}

jar {
    finalizedBy incrementBuildNumber
}

println "Archive du plugin vers : ${archiveDir}"
